format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
# This is the licence of Peipkg's own source. The build deliberately fails
# before emitting binary packages while either linked Peios module lacks
# reviewed redistribution terms; the aggregate expression must be revisited
# together with those two legal decisions rather than guessed here.
license       = "MIT"
license_class = "free"
homepage      = "https://github.com/peios/peipkg"
