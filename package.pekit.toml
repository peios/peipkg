format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
# Peipkg and libp-go are MIT; the generated PKM UAPI binding carries the
# kernel userspace exception. The remaining linked Go modules are permissive
# and their exact texts are collected into every applicable binary package.
license       = "MIT AND BSD-3-Clause AND (GPL-2.0-only WITH Linux-syscall-note)"
license_class = "free"
homepage      = "https://github.com/peios/peipkg"
